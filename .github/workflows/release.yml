name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  # Manual fallback: releases the version in manifest.json from the chosen
  # branch, creating its tag. Fails if that tag already exists.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Lint and build plugin
        run: npm run build

      # The tagged commit is the version actually shipping, so this is where
      # the note-per-release-line rule belongs. It is deliberately excluded
      # from check:compliance, which runs on every ordinary build.
      - name: Verify release-line What's New note
        run: npm run check:pre-release -- --release

      - name: Create release assets
        run: |
          mkdir -p release

          # Copy main files
          cp main.js manifest.json styles.css release/

      - name: Upload release assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: rss-dashboard-release
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rss-dashboard-release
          path: release

      - name: Validate release assets
        shell: bash
        run: |
          test -s release/main.js
          test -s release/manifest.json
          test -s release/styles.css

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            release/main.js
            release/styles.css
            release/manifest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(jq -r .version release/manifest.json)"
          fi

          manifest_version="$(jq -r .version release/manifest.json)"
          if [[ "$tag" != "$manifest_version" ]]; then
            echo "::error::Tag $tag does not match manifest.json version $manifest_version"
            exit 1
          fi

          # Published (not draft) so BRAT can see it. Alpha and beta tags,
          # e.g. 2.1.0-beta.1, are marked as prereleases.
          release_notes="Release $tag"
          release_flags=(--title="$tag" --target="$GITHUB_SHA")

          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            release_notes="${BASH_REMATCH[1]^} release $tag"
            release_flags+=(--prerelease)
          fi

          gh release create "$tag" \
            "${release_flags[@]}" \
            --notes="$release_notes" \
            release/main.js \
            release/manifest.json \
            release/styles.css
